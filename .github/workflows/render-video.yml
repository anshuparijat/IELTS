name: Render teaching video

on:
  push:
    paths:
      - "assets/slides/**"
      - "assets/incoming/*.zip"
  workflow_dispatch:
    inputs:
      narration:
        description: "Optional narration override. Leave blank to use assets/narration.txt."
        required: false
        type: string
      slides_directory:
        description: "Repository folder containing slide images"
        required: true
        default: "assets/slides"
        type: string
      seconds_per_slide:
        description: "Minimum seconds per slide"
        required: true
        default: "20"
        type: string
      watermark:
        description: "Brand watermark"
        required: true
        default: "IELTS WINNERS"
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install edge-tts==7.2.0

      - name: Extract uploaded lesson package
        if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'assets/incoming/') || github.event_name == 'push' && contains(github.event.head_commit.added, 'assets/incoming/')
        run: |
          package=$(find assets/incoming -maxdepth 1 -type f -name '*.zip' | sort | tail -n 1)
          test -n "$package"
          rm -rf assets/slides
          mkdir -p assets/slides
          unzip -o "$package" -d /tmp/lesson-package
          find /tmp/lesson-package -type f \\( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \\) -print0 | sort -z | while IFS= read -r -d '' file; do cp "$file" "assets/slides/$(basename "$file")"; done
          if [ -f /tmp/lesson-package/narration.txt ]; then cp /tmp/lesson-package/narration.txt assets/narration.txt; fi
          test -n "$(find assets/slides -type f | head -n 1)"

      - name: Prepare narration
        env:
          NARRATION_INPUT: ${{ inputs.narration }}
        run: |
          mkdir -p output
          if [ -n "$NARRATION_INPUT" ]; then
            printf '%s' "$NARRATION_INPUT" > output/narration.txt
          else
            test -s assets/narration.txt
            cp assets/narration.txt output/narration.txt
          fi

      - name: Render MP4 with Microsoft Andrew US Neural
        run: |
          python scripts/render_video.py \
            --slides "${{ inputs.slides_directory || 'assets/slides' }}" \
            --narration "$(cat output/narration.txt)" \
            --seconds "${{ inputs.seconds_per_slide || '20' }}" \
            --watermark "${{ inputs.watermark || 'IELTS WINNERS' }}" \
            --output output/ielts-video.mp4

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: ielts-video-mp4
          path: output/ielts-video.mp4
          if-no-files-found: error
          retention-days: 7
