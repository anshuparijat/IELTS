name: Render animated GIF lesson

on:
  push:
    paths:
      - "assets/gifs/**"
  workflow_dispatch:
    inputs:
      lesson_folder:
        description: "Folder under assets/gifs containing GIFs and narration.txt"
        required: true
        default: "assets/gifs/lesson"
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install edge-tts==7.2.0

      - name: Identify lesson folder
        id: lesson
        env:
          MANUAL_FOLDER: ${{ inputs.lesson_folder }}
        run: |
          if [ -n "$MANUAL_FOLDER" ]; then
            folder="$MANUAL_FOLDER"
          else
            changed=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^assets/gifs/.+\\.gif$' | head -n 1 || true)
            test -n "$changed" || { echo "No GIF slide was added or changed in this commit."; exit 1; }
            folder=$(dirname "$changed")
          fi
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "Rendering lesson from $folder"

      - name: Validate lesson package
        run: |
          test -d "${{ steps.lesson.outputs.folder }}"
          test -s "${{ steps.lesson.outputs.folder }}/narration.txt"
          count=$(find "${{ steps.lesson.outputs.folder }}" -maxdepth 1 -type f -iname '*.gif' | wc -l)
          test "$count" -gt 0
          echo "Found $count GIF slides."

      - name: Render MP4 with slide-matched Microsoft Andrew US Neural narration
        run: |
          mkdir -p output
          python scripts/render_video.py \
            --slides "${{ steps.lesson.outputs.folder }}" \
            --narration-file "${{ steps.lesson.outputs.folder }}/narration.txt" \
            --output output/ielts-video.mp4

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: ielts-gif-lesson-mp4
          path: output/ielts-video.mp4
          if-no-files-found: error
          retention-days: 7
